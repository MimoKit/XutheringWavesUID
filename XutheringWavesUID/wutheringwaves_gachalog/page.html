<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>鸣潮 · 唤取记录</title>
<link rel="stylesheet" href="/waves/fonts/fonts.css">
<!-- html2canvas（异步多源；失败不阻塞页面，导出按钮自带回退提示） -->
<script>
(function () {
  var srcs = [
    'https://lib.baomitu.com/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdn.staticfile.org/html2canvas/1.4.1/html2canvas.min.js'
  ];
  var i = 0, done = false, t;
  function next() {
    if (done) return;
    if (i >= srcs.length) return;
    var s = document.createElement('script');
    s.src = srcs[i++];
    s.onload = function () { if (window.html2canvas) { done = true; clearTimeout(t); } else next(); };
    s.onerror = next;
    document.head.appendChild(s);
    clearTimeout(t); t = setTimeout(next, 3000);
  }
  next();
})();
</script>
<!-- GSAP（异步多源；不隐藏内容，导出前强制收尾，保证 html2canvas 不受影响） -->
<script>
(function () {
  var GSAP = [
    'https://lib.baomitu.com/gsap/3.13.0/gsap.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js',
    'https://cdn.staticfile.org/gsap/3.13.0/gsap.min.js'
  ];
  var ST = [
    'https://lib.baomitu.com/gsap/3.13.0/ScrollTrigger.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js',
    'https://cdn.staticfile.org/gsap/3.13.0/ScrollTrigger.min.js'
  ];
  var done = false;
  function fin() { if (done) return; done = true; window.dispatchEvent(new Event('gsapready')); }
  function chain(urls, test, cb) {
    var i = 0, t;
    (function go() {
      if (test()) { cb(true); return; }
      if (i >= urls.length) { cb(false); return; }
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload = function () { test() ? cb(true) : go(); };
      s.onerror = go;
      document.head.appendChild(s);
      clearTimeout(t); t = setTimeout(go, 2000);
    })();
  }
  chain(GSAP, function () { return !!window.gsap; }, function (ok) {
    if (!ok) { fin(); return; }
    chain(ST, function () { return !!window.ScrollTrigger; }, function (okST) {
      if (okST && window.gsap && gsap.registerPlugin) { try { gsap.registerPlugin(ScrollTrigger); } catch (e) {} }
      fin();
    });
  });
  setTimeout(fin, 9000);
})();
</script>
<style>
:root {
  --bg0: #0b0e17;
  --bg1: #10141f;
  --glass: rgba(255, 255, 255, 0.045);
  --glass-2: rgba(255, 255, 255, 0.075);
  --line: rgba(255, 255, 255, 0.08);
  --text: #edf0f6;
  --sub: #a3abbd;
  --dim: #6f778a;
  --gold: #f1cf7c;
  --gold-deep: #c99a3e;
  --purple: #b394f2;
  --teal: #7fd8dc;
  --rose: #f0899b;
  --lucky: #63d39b;
  --normal: #f1cf7c;
  --unlucky: #f27b88;
  --sans: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", system-ui, sans-serif;
  --num: "Oswald", var(--sans);
  --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
html { background: #0b0e17; }
body {
  min-height: 100vh;
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(70% 38% at 50% 0%, rgba(127, 216, 220, 0.07) 0%, transparent 70%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 55%, #090b12 100%);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
#app { position: relative; max-width: 720px; margin: 0 auto; padding: 12px 12px calc(96px + env(safe-area-inset-bottom)); }

/* === 头部 === */
.hero { position: relative; overflow: hidden; border-radius: 16px; background: rgba(13, 18, 34, 0.9); box-shadow: 0 0 0 1px var(--line); }
.hero-sky { position: absolute; inset: 0 0 auto 0; height: 150px; background: var(--img-sky) center / cover no-repeat;
  -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent); mask-image: linear-gradient(180deg, #000 30%, transparent); opacity: .9; }
.hero-in { position: relative; padding: 16px 16px 12px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-size: 19px; font-weight: 700; letter-spacing: .06em; }
.brand span { font-size: 12px; color: var(--sub); letter-spacing: .08em; }
.brand i { width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg) translateY(-2px); box-shadow: 0 0 8px rgba(241, 207, 124, .7); }
.who { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.ava { position: relative; width: 72px; height: 72px; flex: none; }
.ava .pic { position: absolute; inset: 15.5%; border-radius: 50%; overflow: hidden; background: #1a2036; }
.ava .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ava .ring { position: absolute; inset: 0; background: var(--img-ring) center / contain no-repeat; animation: ringSpin 40s linear infinite; }
@keyframes ringSpin { to { transform: rotate(360deg); } }
.who-meta { min-width: 0; }
.user-name { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-uid { margin-top: 2px; font-size: 12.5px; color: var(--sub); letter-spacing: .04em; }
.user-uid b { color: var(--gold); font-weight: 500; }
.stats-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.stat-cell { display: inline-flex; align-items: baseline; gap: 4px; padding: 1px 8px; border-radius: 999px; background: rgba(255, 255, 255, .06); font-size: 11px; color: var(--sub); }
.stat-cell b { font-family: var(--num); font-weight: 500; font-size: 13.5px; color: var(--text); }
.timestamp-line { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line);
  font-size: clamp(10px, 2.8vw, 11.5px); color: var(--dim); white-space: nowrap; }
.timestamp-line .pulse { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px var(--teal); vertical-align: 1px; }

/* === 标签栏 === */
.tab-strip { position: sticky; top: 0; z-index: 20; margin: 10px -12px 10px; padding: 8px 12px; background: rgba(11, 15, 28, 0.88);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab-strip::-webkit-scrollbar { display: none; }
.tab-strip.dragging { cursor: grabbing; user-select: none; }
.tab-strip.dragging .tab { pointer-events: none; }
.tab-strip .inner { display: flex; gap: 6px; min-width: max-content; }
.tab { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--glass); color: var(--sub); font-size: 13px; cursor: pointer; white-space: nowrap; transition: color .2s, background .2s, border-color .2s; }
.tab .badge { font-family: var(--num); font-size: 12px; color: var(--gold); }
.tab.active { color: var(--text); background: rgba(241, 207, 124, .12); border-color: rgba(241, 207, 124, .45); }

/* === 卡池 === */
.pool-section { display: none; }
.pool-section.active { display: block; }
.pool-title { display: none; }
.ov { position: relative; padding: 14px 14px 12px; border-radius: 14px; background: var(--glass); box-shadow: 0 0 0 1px var(--line); margin-bottom: 12px; }
.ov-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ov-name { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
.ov-range { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
.luck { display: flex; align-items: center; gap: 6px; flex: none; }
.luck img { width: 46px; height: 46px; object-fit: contain; }
.luck span { font-size: 12.5px; color: var(--gold); white-space: nowrap; }
.ov-stats { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 8px; font-size: 12.5px; color: var(--sub); }
.ov-stats b { font-family: var(--num); font-weight: 500; font-size: 18px; color: var(--text); margin-left: 4px; }
.ov-stats b.gold { color: var(--gold); }
.ov-pity { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-top: 10px; }
.ov-pity .k { font-size: 12.5px; color: var(--sub); }
.ov-pity .n { font-family: var(--num); font-weight: 500; font-size: 18px; }
.ov-pity .n small { font-size: 12px; color: var(--dim); }
.ov-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.ov-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.ov-tag b { font-family: var(--num); font-weight: 500; font-size: 13.5px; margin: 0 2px; }
.ov-tag.up, .fs-note.up { color: var(--gold); background: rgba(241, 207, 124, .12); }
.ov-tag.wai, .fs-note.wai { color: var(--rose); background: rgba(240, 137, 155, .12); }
.ov-tag.multi, .fs-note.multi { color: var(--teal); background: rgba(127, 216, 220, .12); }
.empty-pool { padding: 28px 16px; text-align: center; color: var(--dim); border-radius: 14px; background: var(--glass); font-size: 13px; }

/* === 日期分组 === */
.date-group { margin-bottom: 8px; }
.date-head { display: flex; align-items: center; gap: 8px; margin: 10px 2px 6px; }
.date-chip { display: flex; align-items: baseline; gap: 6px; }
.date-chip .day { font-family: var(--num); font-weight: 500; font-size: 18px; color: var(--gold); line-height: 1; }
.date-chip .ym { font-size: 12px; color: var(--sub); }
.date-chip .wd { font-size: 11px; color: var(--dim); }
.date-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

/* === 五星行 === */
.fs-pkg { position: relative; margin-bottom: 5px; border-radius: 12px; background: var(--glass); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.fs-pkg.up, .fs-pkg.wai { background: linear-gradient(90deg, var(--side-tint), transparent 45%), var(--glass); }
.fs-pkg.up::before, .fs-pkg.wai::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--side); }
.fs-pkg.up { --side: rgba(241, 207, 124, .8); --side-tint: rgba(241, 207, 124, .07); }
.fs-pkg.wai { --side: rgba(240, 137, 155, .8); --side-tint: rgba(240, 137, 155, .07); }
.fs-card { --row-h: 36px; --top-h: 25px; display: grid; grid-template-columns: 36px 120px minmax(70px, 1fr) 30px 14px; gap: 9px; align-items: start; padding: 6px 10px; position: relative; }
.fs-card.has4 { cursor: pointer; }
.fs-card:hover { background: rgba(255, 255, 255, .025); }
.fs-icon { width: 36px; height: 36px; border-radius: 9px; overflow: hidden; display: grid; place-items: center; background: #1b1d2a var(--img-charbg) center / cover; }
.fs-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fs-icon .pl { font-weight: 700; font-size: 14px; color: var(--gold); }
.fs-meta { min-width: 0; min-height: var(--row-h); display: flex; align-items: center; gap: 6px; }
.fs-name { font-weight: 600; font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 70px; }
.fs-card.is-up .fs-name { color: var(--gold); }
.hide-fs-name .fs-name { display: none; }
.hide-fs-name .fs-meta { justify-content: center; }
.hide-fs-name .fs-card { grid-template-columns: 36px 40px minmax(70px, 1fr) 30px 14px; }
.fs-tags { display: inline-flex; align-items: center; flex: 0 0 auto; }
.tag-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 20px; padding: 0 6px; border-radius: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.seal { position: relative; display: block; width: 34px; height: 28px; flex: none; }
.seal svg { position: absolute; top: 0; left: 3px; width: 28px; height: 28px; }
.seal .up-img { position: absolute; left: 0; top: 1.65px; width: 34px; height: 24.7px; }
.tag-pill.std { color: var(--sub); background: rgba(255, 255, 255, .06); font-weight: 400; }
.bar-stack { min-width: 0; }
.bar-top { min-height: var(--row-h); display: flex; flex-direction: column; justify-content: center; gap: 4px; transition: min-height .26s ease; }
.fs-pkg.open .bar-top { min-height: var(--top-h); }
.fs-pkg.open .fs-pity { line-height: var(--top-h); }
.fs-pkg.open .fs-caret { margin-top: calc(var(--top-h) / 2 - 5px); }
.fs-pkg.open .no-note .tray-wrap { margin-top: -15px; margin-right: 46px; }
.bar-stack .tray-wrap { margin-right: -62px; }
.pity-bar { position: relative; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.pity-bar > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; overflow: hidden; transition: width 1s cubic-bezier(.2, .8, .2, 1); }
.pity-bar > i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, .45) 50%, transparent 80%); transform: translateX(-100%); animation: sheen 2.8s ease-in-out infinite; }
@keyframes sheen { 60%, 100% { transform: translateX(100%); } }
.pity-bar > i.lucky { background: linear-gradient(90deg, #3fb57f, var(--lucky)); }
.pity-bar > i.normal { background: linear-gradient(90deg, #c99a3e, var(--normal)); }
.pity-bar > i.unlucky { background: linear-gradient(90deg, #d5576a, var(--unlucky)); }
.ov-pity .pity-bar { height: 9px; border-radius: 5px; }
.fs-sub { display: flex; align-items: center; gap: 4px; min-width: 0; }
.fs-note { font-size: 10px; line-height: 1; padding: 2px 5px; border-radius: 4px; white-space: nowrap; }
.fs-time { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--dim); text-align: right; line-height: 1; white-space: nowrap; }
.fs-pity { font-family: var(--num); font-weight: 500; font-size: 18px; line-height: var(--row-h); text-align: right; transition: line-height .26s ease; }
.fs-pity.lucky, .ov-pity .n.lucky { color: var(--lucky); }
.fs-pity.normal, .ov-pity .n.normal { color: var(--normal); }
.fs-pity.unlucky, .ov-pity .n.unlucky { color: var(--unlucky); }
.fs-caret { width: 10px; height: 10px; margin-top: calc(var(--row-h) / 2 - 5px); justify-self: end; color: var(--dim); transition: transform .25s, color .25s, margin-top .26s ease; }
.fs-caret svg { width: 100%; height: 100%; display: block; }
.fs-pkg.open .fs-caret { transform: rotate(180deg); color: var(--gold); }

/* === 四星 === */
.tray-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s ease, margin .26s ease; }
.fs-pkg.open .tray-wrap { grid-template-rows: 1fr; }
.tray-in { overflow: hidden; min-height: 0; }
.tray { display: flex; flex-wrap: nowrap; gap: 5px; padding: 3px 0 2px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; cursor: grab; }
.tray::-webkit-scrollbar { display: none; }
.tray.ovf:not(.end) { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); }
.tray.dragging { cursor: grabbing; }
.tray-stub { padding: 3px 0 2px; font-size: 11.5px; color: var(--dim); }
.tray-item { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 2px 8px 2px 2px; border-radius: 8px; background: rgba(179, 148, 242, .08); box-shadow: inset 0 0 0 1px rgba(179, 148, 242, .22); }
.tray-item .ic { width: 24px; height: 24px; border-radius: 6px; overflow: hidden; display: grid; place-items: center; background: radial-gradient(circle at 50% 90%, rgba(179, 148, 242, .55), #1d1a2e 70%); }
.tray-item .ic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fs-icon img.wp, .tray-item .ic img.wp { object-fit: contain; padding: 12%; }
.tray-item .ic .pl { font-size: 11px; color: var(--purple); }
.tray-item .ct { font-family: var(--num); font-size: 12.5px; color: var(--purple); }

/* === 设置 / 导出 === */
.fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 50; display: inline-flex; align-items: center; gap: 7px;
  height: 42px; padding: 0 16px 0 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(14, 19, 34, .9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--text); font-size: 13px; cursor: pointer;
  box-shadow: 0 6px 22px rgba(0, 0, 0, .5); transition: border-color .2s, color .2s; }
.fab:hover, .set-btn:hover { border-color: rgba(241, 207, 124, .6); color: var(--gold); }
.fab.exporting { pointer-events: none; opacity: .65; }
.fab svg { width: 17px; height: 17px; }
.settings { position: fixed; left: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 55; }
.set-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(14, 19, 34, .9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--text); border: 1px solid var(--line);
  box-shadow: 0 6px 22px rgba(0, 0, 0, .5); cursor: pointer; transition: border-color .2s, color .2s; }
.set-btn svg { width: 18px; height: 18px; transition: transform .35s ease; }
.settings.open .set-btn { border-color: rgba(241, 207, 124, .6); color: var(--gold); }
.settings.open .set-btn svg { transform: rotate(90deg); }
.set-panel { position: absolute; left: 0; bottom: 52px; width: 206px; padding: 6px; border-radius: 12px; background: rgba(16, 21, 38, .97);
  box-shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0, 0, 0, .55); transform-origin: 21px 100%;
  opacity: 0; transform: translateY(8px) scale(.94); pointer-events: none; transition: opacity .18s ease, transform .22s ease; }
.settings.open .set-panel { opacity: 1; transform: none; pointer-events: auto; }
.set-row { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; background: none; border: none;
  border-radius: 8px; color: var(--text); font-size: 13.5px; cursor: pointer; }
.set-row:hover { background: rgba(255, 255, 255, .05); }
.sw { width: 34px; height: 20px; border-radius: 10px; background: rgba(255, 255, 255, .1); position: relative; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--sub); transition: transform .2s, background .2s; }
.sw.on { background: rgba(241, 207, 124, .35); }
.sw.on::after { transform: translateX(14px); background: var(--gold); }
.set-split { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; padding: 8px 4px 4px; border-top: 1px solid var(--line); }
.set-split button { padding: 8px 0; border-radius: 8px; cursor: pointer; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); color: var(--sub); font-size: 12.5px; }
.set-split button.on { border-color: rgba(241, 207, 124, .5); color: var(--gold); background: rgba(241, 207, 124, .08); }
.toast { position: fixed; left: 50%; width: max-content; bottom: 84px; transform: translateX(-50%) translateY(16px); z-index: 100; max-width: 86vw; padding: 10px 18px;
  border-radius: 10px; background: rgba(14, 19, 34, .96); box-shadow: 0 0 0 1px var(--line); color: var(--text); font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.sheet { position: fixed; inset: 0; z-index: 90; background: rgba(6, 9, 18, .84); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: sheetIn .2s ease; }
.sheet[hidden] { display: none; }
@keyframes sheetIn { from { opacity: 0; } }
.sheet-btns { display: flex; gap: 8px; }
.sheet-btns[hidden] { display: none; }
.sheet-btns button { flex: 1; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); color: var(--text); font-size: 14px; cursor: pointer; }
.sheet-btns button.pri { border-color: rgba(241, 207, 124, .5); background: rgba(241, 207, 124, .12); color: var(--gold); }
.guide-arrow { position: absolute; top: 6px; right: 18px; width: 92px; height: 74px; color: var(--gold); }
.guide-tip { position: absolute; top: 84px; right: 18px; text-align: right; line-height: 1.7; }
.guide-tip .dots { display: inline-flex; align-items: center; gap: 3px; margin: 0 2px; padding: 5px 7px; border: 1.5px solid currentColor; border-radius: 11px; vertical-align: 2px; }
.guide-tip .dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.guide-tip b { display: block; font-size: 17px; color: var(--gold); }
.guide-tip span { font-size: 13.5px; color: var(--text); }
.guide-card { position: absolute; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); max-width: 420px; margin: 0 auto; padding: 16px; border-radius: 14px;
  background: rgba(16, 21, 38, .97); box-shadow: 0 0 0 1px var(--line); }
.guide-card p { margin: 0 0 12px; font-size: 13px; color: var(--sub); line-height: 1.7; }
.shot { display: flex; flex-direction: column; }
.shot-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 10px 18px; font-size: 13.5px; color: var(--text); }
.shot-bar button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); color: var(--text); font-size: 18px; line-height: 1; cursor: pointer; }
.shot-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 14px 14px; }
.shot-scroll img + img { margin-top: 10px; }
.shot-scroll img { display: block; width: 100%; max-width: 560px; margin: 0 auto; border-radius: 10px; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
.shot .sheet-btns { padding: 0 14px calc(14px + env(safe-area-inset-bottom)); max-width: 560px; width: 100%; margin: 0 auto; box-sizing: border-box; }

.loader { display: grid; place-items: center; height: 70vh; color: var(--sub); }
.loader .ring { width: 36px; height: 36px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-card { margin: 60px 16px; padding: 24px 18px; border-radius: 14px; background: var(--glass); text-align: center; }
.error-card h2 { font-size: 16px; color: var(--rose); margin: 0 0 8px; }
.error-card p { color: var(--sub); font-size: 12.5px; }

@media (min-width: 600px) {
  body { font-size: 15px; }
  #app { padding-left: 18px; padding-right: 18px; }
  .tab-strip { margin-left: -18px; margin-right: -18px; padding-left: 18px; padding-right: 18px; }
  .hero-in { padding: 20px 22px 14px; }
  .ava { width: 82px; height: 82px; }
  .user-name { font-size: 23px; }
  .fs-card { --row-h: 38px; grid-template-columns: 38px 132px minmax(80px, 1fr) 30px 14px; padding: 6px 12px; }
  .fs-icon { width: 38px; height: 38px; }
}
@media (prefers-reduced-motion: reduce) { .pity-bar > i::after, .ava .ring { animation: none; } }

/* === 导出 === */
.export-mode .tab-strip, .export-mode .fab, .export-mode .toast, .export-mode .settings, .export-mode .fs-caret { display: none !important; }
.export-mode .pool-section { display: block !important; }
.export-mode .pool-section + .pool-section { margin-top: 20px; }
.export-mode .pool-title { display: block; margin: 16px 2px 10px; font-size: 20px; font-weight: 700; color: var(--gold); }
.export-mode .fs-card { grid-template-columns: 36px 120px minmax(70px, 1fr) 30px; }
.export-mode.hide-fs-name .fs-card { grid-template-columns: 36px 40px minmax(70px, 1fr) 30px; }
.export-mode .bar-stack .tray-wrap { margin-right: -39px; }
.export-mode .tray { flex-wrap: wrap !important; overflow: visible !important; -webkit-mask-image: none !important; mask-image: none !important; }
.export-mode .tray-wrap { transition: none !important; }
.export-mode .pity-bar > i::after, .export-mode .ava .ring { animation: none !important; }
.export-mode .pity-bar > i::after { display: none; }
.export-mode #app { background: var(--bg0); }
.export-mode .tray-item { box-shadow: none; border: 1px solid rgba(179, 148, 242, .22); }
.export-mode .hero, .export-mode .ov, .export-mode .fs-pkg { box-shadow: none; border: 1px solid var(--line); }
</style>

<script>
const $app = document.getElementById('app');
const $fab = document.getElementById('exportBtn');
const $toast = document.getElementById('toast');
const $settings = document.getElementById('settings');
const HIDE_NAME_KEY = 'ww_gacha_hide_name';
const EXPAND_KEY = 'ww_gacha_expand';
let EXPAND = localStorage.getItem(EXPAND_KEY) !== '0';

const PATH_BASE = location.pathname.replace(/\/$/, '');
const DATA_URL = PATH_BASE + '/data';
const ASSET = (k, rid) => `${PATH_BASE}/${k}/${rid}.png`;

const POOL_LIMITED = new Set(["角色精准调谐", "武器精准调谐", "角色新旅唤取", "武器新旅唤取", "角色联动唤取", "武器联动唤取", "角色忆旅唤取", "武器忆旅唤取"]);
const POOL_PERM = new Set(["角色调谐（常驻池）", "武器调谐（常驻池）"]);
const POOL_NEWBIE = new Set(["新手调谐", "新手自选唤取", "新手自选唤取（感恩定向唤取）"]);

const POOL_ABBR = {
  "角色精准调谐": "限定·角色",
  "武器精准调谐": "限定·武器",
  "角色调谐（常驻池）": "常驻·角色",
  "武器调谐（常驻池）": "常驻·武器",
  "新手调谐": "新手",
  "新手自选唤取": "新手·自选",
  "新手自选唤取（感恩定向唤取）": "感恩·定向",
  "角色新旅唤取": "新旅·角色",
  "武器新旅唤取": "新旅·武器",
  "角色联动唤取": "联动·角色",
  "武器联动唤取": "联动·武器",
  "角色忆旅唤取": "忆旅·角色",
  "武器忆旅唤取": "忆旅·武器",
};
const LUCK_TAG = ["非到极致", "运气不好", "平稳保底", "小欧一把", "欧狗在此"];
const WD = ["日","一","二","三","四","五","六"];

// HTML 转义: 所有用户可控的数据 (角色名等) 渲染前必须经过这个函数,
// 即便目前来源是库洛 API, 纵深防御挡住未来 API/插件中间件污染。
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showToast(msg, ms=1800) {
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => $toast.classList.remove('show'), ms);
}

// 鸣潮 5★ 大保底约 80
const HARD_PITY = 80;

// 与 PIL 抽卡卡片一致: ≤40 绿 / ≥70 红 / 其余 黄
function pityClass(p) {
  if (p <= 40) return 'lucky';
  if (p >= 70) return 'unlucky';
  return 'normal';
}
function pityPct(p) {
  return Math.max(2, Math.min(100, Math.round((p / HARD_PITY) * 100)));
}

function luckLevel(pool) {
  const lv = (v, lst) => { for (let i = 0; i < lst.length; i++) if (v <= lst[i]) return 4 - i; return 0; };
  const n = pool.name;
  if (n === '角色精准调谐') {
    if (pool.avg_up) return lv(pool.avg_up, [68, 81, 93, 99, 114]);
    if (pool.avg_5) return lv(pool.avg_5, [47, 54, 62, 67, 69]);
  } else if (['武器精准调谐', '角色调谐（常驻池）', '武器调谐（常驻池）', '新手自选唤取'].includes(n)) {
    if (pool.avg_5) return lv(pool.avg_5, [45, 52, 59, 65, 70]);
  } else if (n === '新手调谐') {
    if (pool.avg_5) return lv(pool.avg_5, [10, 20, 30, 40, 45]);
  }
  return 2;
}

const CN_NUM = ['', '', '双', '三', '四', '五', '六', '七', '八', '九', '十'];

function poolMarks(pool) {
  const notes = new Map();
  const add = (fs, cls, txt) => { if (!notes.has(fs)) notes.set(fs, []); notes.get(fs).push([cls, txt]); };
  const tags = [];
  if (POOL_LIMITED.has(pool.name) && pool.name.indexOf('武器') < 0) {
    const asc = pool.five_stars.slice().reverse();
    // 歪 + 随后的保底 UP 记作一次大保底
    const units = [];
    for (let i = 0; i < asc.length; i++) {
      if (asc[i].is_up) units.push({ k: 'up', last: asc[i] });
      else if (i + 1 < asc.length && asc[i + 1].is_up) units.push({ k: 'wai', last: asc[++i] });
      else units.push({ k: 'wai', last: asc[i] });
    }
    const best = { up: 0, wai: 0 };
    for (let i = 0; i < units.length;) {
      let j = i;
      while (j + 1 < units.length && units[j + 1].k === units[i].k) j++;
      const len = j - i + 1, k = units[i].k;
      best[k] = Math.max(best[k], len);
      if (len >= 3) add(units[j].last, k, `${len}连${k === 'up' ? 'UP' : '歪'}`);
      i = j + 1;
    }
    if (best.up >= 3) tags.push(['up', `最长<b>${best.up}</b>连UP`]);
    if (best.wai >= 3) tags.push(['wai', `最长<b>${best.wai}</b>连歪`]);
  }
  const byTime = {};
  pool.five_stars.forEach(fs => { if (fs.time && fs.ten !== false) (byTime[fs.time] = byTime[fs.time] || []).push(fs); });
  const multi = {};
  Object.values(byTime).forEach(g => {
    if (g.length < 2) return;
    multi[g.length] = (multi[g.length] || 0) + 1;
    g.forEach(fs => add(fs, 'multi', `十连${CN_NUM[g.length] || g.length}金`));
  });
  Object.keys(multi).map(Number).sort((a, b) => b - a)
    .forEach(k => tags.push(['multi', `十连${CN_NUM[k] || k}金 ×<b>${multi[k]}</b>`]));
  return { notes, tags };
}

function fmtTimeOnly(ts) {
  if (!ts) return '';
  const m = ts.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/);
  return m ? m[4] : ts;
}
function dayKey(ts) {
  if (!ts) return '——';
  return ts.slice(0, 10);
}
function fmtDay(key) {
  const [y, m, d] = key.split('-').map(s => parseInt(s, 10));
  if (!y) return { day: '—', ym: '', wd: '' };
  const date = new Date(y, m - 1, d);
  return {
    day: String(d).padStart(2, '0'),
    ym: `${y}.${String(m).padStart(2, '0')}`,
    wd: '周' + WD[date.getDay()],
  };
}

function dataToBlobUrl(uri) {
  const m = /^data:([^;]+);base64,(.*)$/.exec(uri);
  if (!m) return uri;
  const bin = atob(m[2]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], { type: m[1] }));
}

function tagsFor(name, fs) {

  if (POOL_PERM.has(name)) return `<span class="tag-pill std">常驻</span>`;
  if (POOL_NEWBIE.has(name)) return fs.is_up ? seal('up') : `<span class="tag-pill std">常驻</span>`;

function avatarHTML(item) {
  const rid = item.resourceId;
  // resourceId 必须为纯数字, 否则当作无效, 防止注入到 src/onerror
  const ridSafe = (typeof rid === 'number' && Number.isFinite(rid)) || /^\d+$/.test(String(rid || ''));
  const isWeapon = item.resourceType === '武器' || String(rid).length > 4;
  const url = ridSafe ? ASSET(isWeapon ? 'weapon' : 'avatar', rid) : '';
  const placeholder = (item.name || '?').slice(0, 1);
  if (!ridSafe) return `<div class="pl">${esc(placeholder)}</div>`;
  // onerror 里的字符串通过 dataset 传递, 避免把 placeholder 拼进 JS 字面量造成注入
  return `<img src="${esc(url)}"${isWeapon ? ' class="wp"' : ''} alt="${esc(item.name || '')}" loading="lazy"
    data-pl="${esc(placeholder)}"
    onerror="var d=document.createElement('div');d.className='pl';d.textContent=this.dataset.pl||'?';this.replaceWith(d)">`;
}

function renderHeader(base, dataTime, now) {
  const isNet = base.is_net;
  const stats = [
    ['等级', isNet ? '—' : (base.level ?? '—')],
    ['世界', isNet ? '—' : (base.worldLevel ?? '—')],
    ['活跃', isNet ? '—' : (base.activeDays ?? '—')],
    ['角色', isNet ? '—' : (base.roleNum ?? '—')],
  ];
  return `
    <header class="hero">
      <div class="hero-sky"></div>
      <div class="hero-in">
        <div class="brand"><i></i><b>唤取记录</b><span>鸣潮</span></div>
        <div class="who">
          <div class="ava">
            <div class="pic"><img src="${PATH_BASE}/userpic" alt="avatar" referrerpolicy="no-referrer"></div>
            <i class="ring"></i>
          </div>
          <div class="who-meta">
            <h2 class="user-name">${esc(base.name || `特征码 ${base.uid}`)}</h2>
            <div class="user-uid">UID <b>${esc(base.uid)}</b></div>
            <div class="stats-row">${stats.map(([l, v]) => `<span class="stat-cell">${esc(l)}<b>${esc(v)}</b></span>`).join('')}</div>
          </div>
        </div>
        <div class="timestamp-line">
          <span><span class="pulse"></span>记录更新于 ${esc(dataTime || now)}</span>
          <span>查看于 ${esc((now || '').slice(5, 16))}</span>
        </div>
      </div>
    </header>
  `;
}

function renderTabs(pools) {
  const visible = pools.filter(p => p.total > 0);
  const list = visible.length ? visible : pools.slice(0, 4);
  return `
    <nav class="tab-strip"><div class="inner">
      ${list.map((p, i) => `
        <button class="tab ${i === 0 ? 'active' : ''}" data-target="pool-${i}">
          ${esc(POOL_ABBR[p.name] || p.name)}
          ${p.five_count ? `<span class="badge">${esc(p.five_count)}</span>` : ''}
        </button>
      `).join('')}
    </div></nav>
    <main id="poolsRoot">
      ${list.map((p, i) => renderPool(p, i, i === 0)).join('')}
    </main>
  `;
}

function renderPool(pool, idx, active) {
  // pool-title 默认隐藏, 仅 export-mode 显示, 用于导出 PNG 时分隔每个池
  const titleHTML = `<h2 class="pool-title">${esc(pool.name)}</h2>`;
  if (!pool.total) {
    return `
      <section class="pool-section ${active ? 'active' : ''}" id="pool-${idx}">
        ${titleHTML}
        <div class="empty-pool">「${esc(pool.name)}」暂无唤取数据</div>
      </section>`;
  }
  const groups = {};
  pool.five_stars.forEach(fs => {
    const k = dayKey(fs.time);
    (groups[k] = groups[k] || []).push(fs);
  });
  const range = (pool.time_range || '').split(' ~ ');
  const ym = (s) => (s || '').slice(0, 7).replace('-', '.');
  const rangeShort = range.length === 2 ? `${ym(range[0])} – ${ym(range[1])}` : ym(range[0]);
  const level = luckLevel(pool);
  const stats = [['总抽数', pool.total, ''], ['五星', pool.five_count, 'gold']];
  if (POOL_LIMITED.has(pool.name)) stats.push(['UP', pool.up_count || 0, 'gold']);
  if (pool.avg_5) stats.push(['每金', Math.round(pool.avg_5 * 10) / 10, '']);
  if (POOL_LIMITED.has(pool.name) && pool.avg_up) stats.push(['每UP', Math.round(pool.avg_up * 10) / 10, '']);
  const pc = pityClass(pool.remain);
  const marks = poolMarks(pool);

  return `
    <section class="pool-section ${active ? 'active' : ''}" id="pool-${idx}">
      ${titleHTML}
      <div class="ov">
        <div class="ov-top">
          <div>
            <div class="ov-name">${esc(pool.name)}</div>
            ${rangeShort ? `<div class="ov-range">${esc(rangeShort)}</div>` : ''}
          </div>
          <div class="luck"><img src="${EMO[level]}" alt=""><span>${LUCK_TAG[level]}</span></div>
        </div>
        <div class="ov-stats">${stats.map(([l, v, c]) => `<span>${esc(l)}<b class="${c}">${esc(v)}</b></span>`).join('')}</div>
        ${marks.tags.length ? `<div class="ov-tags">${marks.tags.map(([c, t]) => `<span class="ov-tag ${c}">${t}</span>`).join('')}</div>` : ''}
        <div class="ov-pity">
          <span class="k">未出金</span>
          <div class="pity-bar"><i class="${pc}" style="width:${pityPct(pool.remain)}%"></i></div>
          <span class="n ${pc}">${esc(pool.remain)}<small> / ${HARD_PITY}</small></span>
        </div>
      </div>
      ${Object.keys(groups).map(k => renderDateGroup(k, groups[k], pool.name, marks.notes)).join('')}
    </section>
  `;
}

function renderDateGroup(key, fives, poolName, notes) {

  return `

      <div class="date-head">
        <div class="date-chip"><span class="day">${esc(f.day)}</span><span class="ym">${esc(f.ym)}</span><span class="wd">${esc(f.wd)}</span></div>
        <div class="date-line"></div>
      </div>
      ${fives.map(fs => render5Star(fs, poolName, notes.get(fs) || [])).join('')}
    </div>
  `;
}

function render5Star(fs, poolName, notes) {
  const has4 = !!(fs.top_4stars && fs.top_4stars.length);
  const isStub = !!fs.is_stub;
  const expandable = has4 || isStub;
  const cls = `fs-card${fs.is_up ? ' is-up' : ''}${expandable ? ' has4' : ''}${notes.length ? '' : ' no-note'}`;
  const pc = pityClass(fs.pity);
  const side = fs.is_up && !POOL_PERM.has(poolName) ? ' up' : (POOL_LIMITED.has(poolName) && !fs.is_up ? ' wai' : '');
  const caret = expandable
    ? `<span class="fs-caret" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M1 3 L5 7 L9 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>`
    : `<span class="fs-caret" style="visibility:hidden"></span>`;
  return `
    <div class="fs-pkg${expandable && EXPAND ? ' open' : ''}${side}">
      <div class="${cls}">
        <div class="fs-icon">${avatarHTML(fs)}</div>
        <div class="fs-meta">
          <span class="fs-tags">${tagsFor(poolName, fs)}</span>
          <span class="fs-name">${esc(fs.name || '未知')}</span>
        </div>
        <div class="bar-stack">
          <div class="bar-top">
            <div class="pity-bar"><i class="${pc}" style="width:${pityPct(fs.pity)}%"></i></div>
            <div class="fs-sub">${notes.map(([c, t]) => `<span class="fs-note ${c}">${esc(t)}</span>`).join('')}<span class="fs-time">${esc(fmtTimeOnly(fs.time))}</span></div>
          </div>
          ${render4Tray(fs.top_4stars, isStub)}
        </div>
        <span class="fs-pity ${pc}">${esc(fs.pity)}</span>
        ${caret}
      </div>
    </div>
  `;
}

function render4Tray(items, isStub) {
  const wrap = inner => `<div class="tray-wrap"><div class="tray-in">${inner}</div></div>`;
  if (isStub && (!items || !items.length)) {
    return wrap(`<div class="tray-stub">旧版记录未区分四星</div>`);
  }
  if (!items || !items.length) return '';
  return wrap(`
    <div class="tray">
      ${items.map(it => `
        <div class="tray-item" title="${esc(it.name + ' ×' + it.count)}">
          <div class="ic">${avatarHTML(it)}</div>
          <span class="ct">×${esc(it.count)}</span>
        </div>
      `).join('')}
    </div>
  `);
}

/* ---------- 四星 ---------- */
function updateTrays(root) {
  (root || document).querySelectorAll('.tray').forEach(t => {
    t.classList.toggle('ovf', t.scrollWidth > t.clientWidth + 1);
    t.classList.toggle('end', t.scrollLeft + t.clientWidth >= t.scrollWidth - 2);
  });
}
function bindTrays() {
  document.querySelectorAll('.tray').forEach(t => {
    t.addEventListener('scroll', () => t.classList.toggle('end', t.scrollLeft + t.clientWidth >= t.scrollWidth - 2), { passive: true });
    let x0 = 0, s0 = 0, drag = false;
    t.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse') return;
      drag = true; x0 = e.clientX; s0 = t.scrollLeft; t.setPointerCapture(e.pointerId); t.classList.add('dragging');
    });
    t.addEventListener('pointermove', (e) => { if (drag) t.scrollLeft = s0 - (e.clientX - x0); });
    const stop = () => { drag = false; t.classList.remove('dragging'); };
    t.addEventListener('pointerup', stop);
    t.addEventListener('pointercancel', stop);
  });
  window.addEventListener('resize', () => updateTrays());
  updateTrays();
}

function bindTabs() {
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.target;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.pool-section').forEach(s => s.classList.toggle('active', s.id === id));
      btn.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      animatePool(document.getElementById(id));
      updateTrays(document.getElementById(id));
      const strip = document.querySelector('.tab-strip');
      if (strip && strip.getBoundingClientRect().top <= 0) window.scrollTo({ top: strip.offsetTop, behavior: 'smooth' });
    });
  });

  document.querySelectorAll('.tab-strip').forEach(strip => {
    let isDragging = false;
    let startX = 0;
    let scrollLeft = 0;
    let hasMoved = false;

    strip.addEventListener('mousedown', (e) => {
      isDragging = true;
      hasMoved = false;
      startX = e.pageX - strip.offsetLeft;
      scrollLeft = strip.scrollLeft;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const x = e.pageX - strip.offsetLeft;
      const walk = (x - startX) * 1.5;
      if (Math.abs(walk) > 5) {
        hasMoved = true;
        strip.classList.add('dragging');
        e.preventDefault();
        strip.scrollLeft = scrollLeft - (x - startX);
      }
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        strip.classList.remove('dragging');
      }
    });

    strip.addEventListener('click', (e) => {
      if (hasMoved) {
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);
  });
}

function bindRowToggle() {
  document.body.addEventListener('click', (e) => {
    const card = e.target.closest('.fs-card.has4');
    if (!card || e.target.closest('.tray-wrap')) return;
    const pkg = card.parentElement;
    if (pkg && pkg.classList.contains('fs-pkg')) {
      pkg.classList.toggle('open');
      updateTrays(pkg);
    }
  });
}

const UA = navigator.userAgent || '';
const IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IN_APP = /MicroMessenger|wxwork|\bQQ\/\d|Weibo|DingTalk|AlipayClient|aweme|BytedanceWebview|baiduboxapp|xhsdiscover|KsWebView|; wv\)/i.test(UA)
  || (/iPhone|iPad|iPod/.test(UA) && !/Safari\//.test(UA));
const CAN_DOWNLOAD = 'download' in HTMLAnchorElement.prototype;
const MAX_CANVAS_AREA = 16e6;
const EXPORT_WIDTH = 720;
const MAX_CANVAS_SIDE = matchMedia('(pointer: coarse)').matches ? 16000 : 32000;
const EXPORT_CUT_SEL = '.hero, .tab-strip, .pool-title, .ov, .date-head, .fs-pkg, .empty-pool';
const sleep = ms => new Promise(r => setTimeout(r, ms));

function openSheet($el) { $el.hidden = false; document.body.style.overflow = 'hidden'; }
function closeSheet($el) { $el.hidden = true; document.body.style.overflow = ''; }
function saveFile(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function copyLink() {
  try {
    await navigator.clipboard.writeText(location.href);
  } catch (e) {
    const t = document.createElement('textarea');
    t.value = location.href; t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t); t.select();
    const ok = document.execCommand('copy'); t.remove();
    if (!ok) { showToast('复制失败，请手动复制地址栏链接'); return; }
  }
  showToast('链接已复制，到浏览器粘贴打开', 2600);
}
function showShot(srcs, files) {
  const multi = srcs.length > 1 ? `共 ${srcs.length} 张，` : '';
  document.getElementById('shotList').innerHTML = srcs.map(s => `<img src="${s}" alt="唤取记录导出图">`).join('');
  document.getElementById('shotHint').textContent = multi + (files ? '长按图片可存到相册' : '长按图片，选择「保存图片」');
  document.getElementById('shotBtns').hidden = !files;
  document.getElementById('shotSave').onclick = async () => {
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files }); } catch (e) { if (e.name !== 'AbortError') files.forEach(saveFile); }
    } else files.forEach(saveFile);
  };
  openSheet(document.getElementById('shotView'));
}
function bindExport() {
  const $guide = document.getElementById('openGuide');
  const $shot = document.getElementById('shotView');
  $guide.addEventListener('click', (e) => { if (e.target === $guide) closeSheet($guide); });
  document.getElementById('guideCopy').addEventListener('click', copyLink);
  document.getElementById('guideShot').addEventListener('click', async () => {
    closeSheet($guide);
    const canvases = await renderCanvases();
    if (!canvases) return;
    const urls = canvases.map(c => c.toDataURL('image/png'));
    if (urls.some(u => u.length < 64)) showToast('图片生成失败，可以先「全部折叠」再导出', 3000);
    else showShot(urls);
  });
  document.getElementById('shotClose').addEventListener('click', () => {
    const $list = document.getElementById('shotList');
    $list.querySelectorAll('img').forEach(im => { if (im.src.startsWith('blob:')) URL.revokeObjectURL(im.src); });
    $list.innerHTML = '';
    closeSheet($shot);
  });
  $fab.addEventListener('click', exportPNG);
  $fab.hidden = false;
}

const inClosedTray = el => !!el.closest('.tray-wrap') && !el.closest('.open');

function exportSlices(app) {
  const top = app.getBoundingClientRect().top;
  const boxes = [...app.querySelectorAll(EXPORT_CUT_SEL)].map(el => {
    const r = el.getBoundingClientRect();
    return [r.top - top, r.bottom - top];
  });
  const cuts = boxes.map(b => b[0]).filter(y => y > 0 && !boxes.some(b => b[0] < y && y < b[1])).sort((a, b) => a - b);
  const w = app.offsetWidth, h = app.scrollHeight;
  const fit = Math.min(Math.sqrt(MAX_CANVAS_AREA / (w * h)), MAX_CANVAS_SIDE / h);
  if (fit >= 1) return { scale: Math.min(window.devicePixelRatio || 1, 2, fit), ranges: [[0, h]] };
  const max = Math.min(MAX_CANVAS_AREA / w, MAX_CANVAS_SIDE);
  const ranges = [];
  let s = 0;
  while (h - s > max) {
    const c = cuts.filter(y => y > s + max / 2 && y <= s + max).pop() || s + max;
    ranges.push([s, c]);
    s = c;
  }
  ranges.push([s, h]);
  return { scale: 1, ranges };
}

function guardCreatePattern() {
  const proto = CanvasRenderingContext2D.prototype;
  if (proto.createPattern.guarded) return;
  const raw = proto.createPattern;
  const blank = document.createElement('canvas');
  blank.width = blank.height = 1;
  proto.createPattern = function (img, repeat) {
    return raw.call(this, img && (img.width === 0 || img.height === 0) ? blank : img, repeat);
  };
  proto.createPattern.guarded = true;
}

async function renderCanvases() {
  // 导出前强制结束入场动画并清掉内联样式, 保证 html2canvas 捕获到最终态
  if (window.gsap) {
    if (window.ScrollTrigger) ScrollTrigger.getAll().forEach(function (st) { st.kill(); });
    gsap.killTweensOf('#app, #app *');
    gsap.set(gsap.utils.toArray('#app .hero, #app .tab, #app .stat-cell, #app .pool-section .ov, #app .pool-section .date-head, #app .pool-section .fs-pkg, #app .pool-section .empty-pool'), { clearProps: 'transform,opacity,visibility' });
  }
  if (!window.html2canvas) { showToast('导出库未加载，请稍后再试'); return null; }
  guardCreatePattern();
  $fab.classList.add('exporting');
  const $span = $fab.querySelector('span');
  $span.textContent = '生成中…';
  document.body.classList.add('export-mode');
  try {
    const target = document.getElementById('app');
    const imgs = [...target.querySelectorAll('img')].filter(im => !im.complete && !inClosedTray(im));
    let done = 0;
    const loads = imgs.map(im => new Promise(res => {
      const fin = () => { done++; $span.textContent = `生成中 ${done}/${imgs.length}`; res(); };
      im.addEventListener('load', fin, { once: true });
      im.addEventListener('error', fin, { once: true });
      im.loading = 'eager';
      im.src = im.src;
    }));
    await Promise.race([Promise.all(loads), sleep(10000)]);
    $span.textContent = '生成中…';
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const base = {
      backgroundColor: '#0b0f1c',
      useCORS: true, logging: false,
      allowTaint: false, imageTimeout: 20000,
      windowWidth: Math.max(EXPORT_WIDTH, target.scrollWidth),
      ignoreElements: inClosedTray,
    };
    let plan = target.offsetWidth >= EXPORT_WIDTH ? exportSlices(target) : null;
    if (!plan) await html2canvas(target, { ...base, scale: 1, height: 1, onclone: doc => { plan = exportSlices(doc.getElementById('app')); } });
    if (!plan) plan = exportSlices(target);
    const out = [];
    for (const [i, [y0, y1]] of plan.ranges.entries()) {
      if (plan.ranges.length > 1) $span.textContent = `生成中 ${i + 1}/${plan.ranges.length}`;
      out.push(await html2canvas(target, { ...base, scale: plan.scale, y: y0, height: Math.ceil(y1 - y0) }));
    }
    return out;
  } catch (e) {
    console.error(e);
    showToast('导出失败：' + ((e && e.message) || '未知错误'));
    return null;
  } finally {
    document.body.classList.remove('export-mode');
    $fab.classList.remove('exporting');
    $span.textContent = '导出 PNG';
  }
}

async function exportPNG() {
  if (IN_APP) { openSheet(document.getElementById('openGuide')); return; }
  const canvases = await renderCanvases();
  if (!canvases) return;
  const blobs = await Promise.all(canvases.map(c => new Promise(r => c.toBlob(r, 'image/png'))));
  if (blobs.some(b => !b)) { showToast('图片生成失败，可以先「全部折叠」再导出', 3000); return; }
  const stem = 'gacha_archive_' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const files = blobs.map((b, i) => new File([b], stem + (blobs.length > 1 ? `_${i + 1}` : '') + '.png', { type: 'image/png' }));
  if (IOS || !CAN_DOWNLOAD) { showShot(blobs.map(b => URL.createObjectURL(b)), files); return; }
  for (const f of files) { saveFile(f); await sleep(300); }
  showToast(files.length > 1 ? `已导出 ${files.length} 张图片到下载目录` : '已导出到下载目录');
}

var __gachaST = [];
var __items = [];
var __entered = [];
var __revealIdx = 0;
var __pumping = false;
var __pumpCall = null;
function curGap() {
  var g = 0.05;
  var el = __items[__revealIdx];
  if (el) {
    var vh = window.innerHeight || document.documentElement.clientHeight || 1;
    var t = el.getBoundingClientRect().top / vh;
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    g = 0.02 + 0.13 * t * t;
  }
  return g;
}
function gachaItems(section) {
  if (!section) return [];
  return gsap.utils.toArray(section.querySelectorAll('.ov, .date-head, .fs-pkg, .empty-pool'));
}
function pumpReveal() {
  if (__pumping) return;
  // 已滚出视口顶部的条目: 直接显示, 让逐条动画追到视口顶部上方一点再继续
  var skipTo = __revealIdx;
  while (skipTo < __items.length && __items[skipTo].getBoundingClientRect().bottom < -80) skipTo++;
  if (skipTo > __revealIdx) {
    gsap.set(__items.slice(__revealIdx, skipTo), { autoAlpha: 1, clearProps: 'transform,opacity,visibility' });
    __revealIdx = skipTo;
  }
  if (__revealIdx >= __items.length || !__entered[__revealIdx]) return;
  __pumping = true;
  var el = __items[__revealIdx++];
  gsap.to(el, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power2.out', clearProps: 'transform,opacity,visibility' });
  __pumpCall = gsap.delayedCall(curGap(), function () { __pumping = false; pumpReveal(); });
}
function animatePool(section) {
  if (!window.gsap || !section) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var items = gachaItems(section);
  if (!items.length) return;
  __gachaST.forEach(function (st) { st.kill(); });
  __gachaST = [];
  if (__pumpCall) { __pumpCall.kill(); __pumpCall = null; }
  __items = items; __entered = []; __revealIdx = 0; __pumping = false;
  if (window.ScrollTrigger) {
    gsap.set(items, { autoAlpha: 0, y: 20 });
    __gachaST = ScrollTrigger.batch(items, {
      start: 'top bottom-=30',
      once: true,
      onEnter: function (batch) {
        for (var b = 0; b < batch.length; b++) {
          var i = items.indexOf(batch[b]);
          if (i >= 0) __entered[i] = true;
        }
        pumpReveal();
      }
    });
    ScrollTrigger.refresh();
  } else {
    gsap.from(items, { autoAlpha: 0, y: 16, stagger: 0.05, duration: 0.5, ease: 'power2.out', clearProps: 'transform,opacity,visibility' });
  }
}
function playGachaIntro() {
  if (!window.gsap) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var hero = document.querySelector('.hero');
  var cells = gsap.utils.toArray('.stats-row .stat-cell');
  var tabs = gsap.utils.toArray('.tab-strip .tab');
  var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
  if (hero) tl.from(hero, { autoAlpha: 0, y: 16, duration: 0.55, clearProps: 'transform,opacity,visibility' });
  if (cells.length) tl.from(cells, { autoAlpha: 0, y: 6, stagger: 0.05, duration: 0.3, clearProps: 'transform,opacity,visibility' }, '-=0.25');
  if (tabs.length) tl.from(tabs, { autoAlpha: 0, y: 8, stagger: 0.03, duration: 0.35, clearProps: 'transform,opacity,visibility' }, '-=0.3');
  animatePool(document.querySelector('.pool-section.active'));
}

(async function boot() {
  try {
    const r = await fetch(DATA_URL, { credentials: 'same-origin' });
    if (!r.ok) {
      $app.innerHTML = `<div class="error-card"><h2>链接已过期</h2><p>抽卡记录页面只在 10 分钟内有效，请重新发送「抽卡页面」获取新链接。</p></div>`;
      return;
    }
    const data = await r.json();
    $app.innerHTML = renderHeader(data.base, data.data_time, data.now) + renderTabs(data.pools);
    bindTabs();
    bindRowToggle();
    bindSettings();
    bindTrays();
    if (window.gsap) playGachaIntro();
    else window.addEventListener('gsapready', playGachaIntro, { once: true });
    bindExport();
  } catch (e) {
    console.error(e);
    $app.innerHTML = `<div class="error-card"><h2>加载失败</h2><p>${esc((e && e.message) || '网络异常，请刷新重试')}</p></div>`;
  }
})();
